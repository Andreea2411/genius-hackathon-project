  <head>
<meta charset="UTF-8">

<title>Terra Guard</title>
<style>
:root{
    --bg:#07130a;
    --panel:rgba(255,255,255,0.08);
    --text:#ffffff;
    --accent:#22ff66;
    --accent2:#8cff66;
    --muted:#9effb3;
}
  
body {
  margin: 0;
  color: var(--text);
  font-family: Arial, sans-serif;
  line-height: 1.4;
  background: url("https://images.unsplash.com/photo-1718599072561-07423038f9c7?ixlib=rb-4.1.0&q=85&fm=jpg&crop=entropy&cs=srgb&dl=dembee-tsogoo-zVNU8WC1ino-unsplash.jpg") center/cover fixed no-repeat;
  transition: background 0.5s ease, color 0.4s ease;
}

.particles::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background-image:
    radial-gradient(#22ff66 1px, transparent 1px);
    background-size:40px 40px;
    opacity:0.08;
    animation:moveParticles 30s linear infinite;
    pointer-events:none;
}

@keyframes moveParticles{
    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-200px);
    }
}

.glow{
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    filter:blur(140px);
    opacity:0.18;
    animation:floatGlow 8s ease-in-out infinite;
}

.glow:nth-child(1){
    background:#22ff66;
    top:-100px;
    left:-100px;
}

.glow:nth-child(2){
    background:#00ffcc;
    bottom:-100px;
    right:-100px;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 60px;
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(0,0,0,0.35);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.logo{
    font-size:24px;
    font-weight:900;
    color:var(--accent);

    text-shadow:
    0 0 10px rgba(34,255,102,0.5),
    0 0 30px rgba(34,255,102,0.2);
}

nav{
    display:flex;
    align-items:center;
}

nav a{
    color:white;
    margin:0 18px;
    text-decoration:none;
    font-size:15px;
    position:relative;
    transition:0.3s;
    opacity:0.85;
}

nav a:hover{
    color:#22ff66;
    opacity:1;
}

nav a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-6px;
    width:0%;
    height:2px;
    background:#22ff66;
    transition:0.3s;
}

nav a:hover::after{
    width:100%;
}
.btn,
.primary-btn{
    background:
    linear-gradient(
    90deg,
    #22ff66,
    #8cff66
    );

    padding:15px 30px;
    border-radius:999px;
    color:black;
    text-decoration:none;
    font-weight:800;
    display:inline-flex;
    justify-content:center;
    align-items:center;
    transition:0.4s;
    box-shadow:
    0 0 25px rgba(34,255,102,0.3);
}


footer{
    text-align:center;
    padding:20px;
    background:#75ce6d50;
    color:white;
}

@media (max-width:768px){

    header{
        flex-direction:column;
        gap:20px;
        padding:20px;
        text-align:center;
    }

    nav{
        flex-wrap:wrap;
        justify-content:center;
        gap:15px;
    }

    nav a{
        margin:0;
        font-size:14px;
    }

    .buttons{
        justify-content:center;
    }

    .primary-btn,
    .secondary-btn,
    .btn{
        width:100%;
        max-width:280px;
    }

    .features{
        flex-direction:column;
        padding:30px 20px;
    }

    footer{
        font-size:14px;
    }
}
</style>
